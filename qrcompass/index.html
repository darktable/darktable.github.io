<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
<title>QRCompass</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #000000;
    --secondary: #666666;
    --blue: #007aff;
    --green: #34c759;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --text: #ffffff;
      --secondary: #999999;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }

  .screen { display: none; flex-direction: column; align-items: center; justify-content: center; flex: 1; }
  .screen.active { display: flex; }

  /* Permission & Loading screens */
  .status-icon { font-size: 60px; margin-bottom: 16px; }
  .status-title { font-weight: 700; font-size: 1.25rem; margin-bottom: 8px; }
  .status-msg { font-size: 1rem; color: var(--secondary); text-align: center; padding: 0 32px; }
  .start-btn {
    margin-top: 24px;
    padding: 12px 32px;
    font-size: 1rem;
    font-weight: 600;
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .start-btn:active { opacity: 0.8; }

  /* Ready screen */
  #screen-ready {
    justify-content: flex-start;
  }
  #info-bar {
    display: flex;
    align-items: center;
    width: 100%;
    padding: 8px 16px;
    font-family: ui-monospace, 'SF Mono', 'Menlo', 'Courier New', monospace;
    font-size: 0.85rem;
    color: var(--secondary);
    gap: 8px;
  }
  #info-bar .spacer { flex: 1; }
  #north-icon { display: flex; align-items: center; }
  #north-icon svg { width: 20px; height: 20px; }
  #north-check {
    display: none;
    color: var(--green);
    font-size: 1.1rem;
    line-height: 1;
  }
  #north-check.visible { display: inline; }

  #qr-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    overflow: hidden;
  }
  #qr-canvas {
    transition: transform 0.08s linear;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
</style>
</head>
<body>

<!-- Permission screen -->
<div id="screen-permission" class="screen active">
  <div class="status-icon">&#x1F9ED;</div>
  <div class="status-title">QRCompass</div>
  <div class="status-msg">Encodes your location as a QR code aligned to true north. Requires location and compass access.</div>
  <button class="start-btn" id="start-btn">Start</button>
</div>

<!-- Loading screen -->
<div id="screen-loading" class="screen">
  <div class="status-icon">&#x1F4E1;</div>
  <div class="status-title">Getting Location...</div>
  <div class="status-msg">Waiting for GPS fix.</div>
</div>

<!-- Ready screen -->
<div id="screen-ready" class="screen">
  <div id="info-bar">
    <span id="north-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="2" x2="12" y2="22"/>
        <polyline points="5 9 12 2 19 9"/>
      </svg>
    </span>
    <span id="heading-label">---</span>
    <span class="spacer"></span>
    <span id="coord-label">--.--, --.--</span>
    <span id="north-check">&#x2705;</span>
  </div>
  <div id="qr-container">
    <canvas id="qr-canvas"></canvas>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
(function() {
  'use strict';

  // --- State machine ---
  const screens = {
    permission: document.getElementById('screen-permission'),
    loading: document.getElementById('screen-loading'),
    ready: document.getElementById('screen-ready'),
  };
  function setState(s) {
    Object.values(screens).forEach(el => el.classList.remove('active'));
    screens[s].classList.add('active');
  }

  // --- DOM refs ---
  const canvas = document.getElementById('qr-canvas');
  const ctx = canvas.getContext('2d');
  const headingLabel = document.getElementById('heading-label');
  const coordLabel = document.getElementById('coord-label');
  const northIcon = document.getElementById('north-icon');
  const northCheck = document.getElementById('north-check');
  const qrContainer = document.getElementById('qr-container');

  // --- Heading state ---
  let lastRawHeading = null;
  let continuousHeading = 0;
  let displayHeading = 0;
  let compassAvailable = false;

  // --- Location state ---
  let lastLat = null;
  let lastLon = null;
  let currentPayload = null;
  const FALLBACK_LAT = 51.51;
  const FALLBACK_LON = -0.13;
  const DISTANCE_FILTER = 500; // meters

  // --- Haversine distance (meters) ---
  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  // --- Heading label ---
  function formatHeading(deg) {
    const dirs = ['N','NE','E','SE','S','SW','W','NW'];
    const idx = Math.floor((deg + 22.5) / 45) % 8;
    return String(Math.round(deg)).padStart(3, '0') + '\u00B0 ' + dirs[idx];
  }

  // --- QR generation ---
  const QR_BORDER = 1; // border width in QR modules — tune this value
  function generateQR(payload) {
    const qr = qrcode(0, 'M');
    qr.addData(payload);
    qr.make();
    const count = qr.getModuleCount();
    const scale = 10;
    const dpr = window.devicePixelRatio || 1;
    const total = count + QR_BORDER * 2;
    const px = total * scale;
    canvas.width = px * dpr;
    canvas.height = px * dpr;
    canvas.style.width = px + 'px';
    canvas.style.height = px + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, px, px);
    ctx.fillStyle = '#000000';
    const offset = QR_BORDER * scale;
    for (let r = 0; r < count; r++) {
      for (let c = 0; c < count; c++) {
        if (qr.isDark(r, c)) ctx.fillRect(offset + c * scale, offset + r * scale, scale, scale);
      }
    }
    currentPayload = payload;
  }

  // --- UID: 4-char base64 hash from lat, lon, and creation time ---
  function generateUID(lat, lon) {
    const str = lat.toFixed(2) + ',' + lon.toFixed(2) + ',' + Date.now();
    let h = 0;
    for (let i = 0; i < str.length; i++) {
      h = ((h << 5) - h + str.charCodeAt(i)) | 0;
    }
    // Convert 32-bit hash to 4 base64 chars (24 bits = 4 × 6-bit chars)
    const b64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
    const v = (h >>> 0) & 0xFFFFFF;
    return b64[(v >> 18) & 63] + b64[(v >> 12) & 63] + b64[(v >> 6) & 63] + b64[v & 63];
  }

  // --- Update location ---
  function updateLocation(lat, lon) {
    const rLat = parseFloat(lat.toFixed(2));
    const rLon = parseFloat(lon.toFixed(2));

    if (lastLat !== null && haversine(lastLat, lastLon, rLat, rLon) < DISTANCE_FILTER) {
      return;
    }
    lastLat = rLat;
    lastLon = rLon;

    const uid = generateUID(rLat, rLon);
    coordLabel.textContent = rLat.toFixed(2) + ', ' + rLon.toFixed(2);
    const payload = '{"id":"qrcmps","uid":"' + uid + '","pos":[' + rLat.toFixed(2) + ',' + rLon.toFixed(2) + ']}';
    generateQR(payload);
    updateRotation();
    setState('ready');
  }

  // --- Heading update ---
  function onHeading(raw) {
    if (raw == null || isNaN(raw)) return;
    if (!compassAvailable) {
      compassAvailable = true;
      northIcon.style.color = 'var(--blue)';
    }
    displayHeading = raw;
    if (lastRawHeading !== null) {
      let delta = raw - lastRawHeading;
      if (delta > 180) delta -= 360;
      if (delta < -180) delta += 360;
      continuousHeading += delta;
    } else {
      continuousHeading = raw;
    }
    lastRawHeading = raw;

    headingLabel.textContent = formatHeading(displayHeading);
    const nearNorth = displayHeading <= 2 || displayHeading >= 358;
    northCheck.classList.toggle('visible', nearNorth);

    updateRotation();
  }

  // --- Rotation & sizing ---
  function updateRotation() {
    if (!currentPayload) return;
    const w = qrContainer.clientWidth;
    const h = qrContainer.clientHeight;
    const theta = displayHeading * Math.PI / 180;
    const trigSum = Math.max(Math.abs(Math.cos(theta)) + Math.abs(Math.sin(theta)), 1e-9);
    const side = Math.min(w, h) / trigSum;

    canvas.style.width = side + 'px';
    canvas.style.height = side + 'px';
    canvas.style.transform = 'rotate(' + (-continuousHeading) + 'deg)';
  }

  window.addEventListener('resize', updateRotation);

  // --- Screen orientation offset (device top → screen top) ---
  function screenAngle() {
    if (screen.orientation && screen.orientation.angle != null) return screen.orientation.angle;
    return window.orientation || 0; // fallback for older iOS Safari
  }

  // --- Compass listeners ---
  function startCompass() {
    // iOS: webkitCompassHeading on deviceorientation
    // Android: deviceorientationabsolute preferred, fallback to deviceorientation
    let usingAbsolute = false;

    function handleOrientation(e) {
      if (usingAbsolute && e.type === 'deviceorientation') return;
      let raw;
      if (e.webkitCompassHeading != null) {
        // iOS: webkitCompassHeading is relative to device portrait top.
        // Correct for screen orientation using window.orientation (reliable on iOS;
        // screen.orientation.angle can be wrong on iPads that report landscape as natural).
        raw = (e.webkitCompassHeading + (window.orientation || 0) + 360) % 360;
      } else if (e.alpha != null) {
        // Android: alpha is in device coordinates, correct for screen rotation
        raw = ((360 - e.alpha) + screenAngle() + 360) % 360;
      } else {
        return;
      }
      onHeading(raw);
    }

    if ('ondeviceorientationabsolute' in window) {
      window.addEventListener('deviceorientationabsolute', function(e) {
        usingAbsolute = true;
        handleOrientation(e);
      });
    }
    window.addEventListener('deviceorientation', handleOrientation);
  }

  // --- Geolocation ---
  function startGeolocation() {
    setState('loading');
    if (!navigator.geolocation) {
      updateLocation(FALLBACK_LAT, FALLBACK_LON);
      return;
    }
    navigator.geolocation.watchPosition(
      function(pos) { updateLocation(pos.coords.latitude, pos.coords.longitude); },
      function(err) {
        console.warn('Geolocation error:', err.message);
        if (lastLat === null) updateLocation(FALLBACK_LAT, FALLBACK_LON);
      },
      { enableHighAccuracy: false }
    );
  }

  // --- Start button ---
  document.getElementById('start-btn').addEventListener('click', async function() {
    // iOS requires user gesture for DeviceOrientationEvent permission
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      try {
        const result = await DeviceOrientationEvent.requestPermission();
        if (result === 'granted') {
          startCompass();
        }
      } catch (e) {
        console.warn('Orientation permission error:', e);
      }
    } else {
      startCompass();
    }
    startGeolocation();
  });
})();
</script>
</body>
</html>
